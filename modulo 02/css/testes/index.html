<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #DFE5E6;
        }

        nav {
            display: flex;
            background-color: #123C60;
            color: white;
            flex-direction: column;
        }

        nav ul {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 0;
        }

        li {
            list-style: none;
        }

        a {
            text-decoration: none;
            color: white;
            font-size: 12px;
        }

        h1 {
            font-size: 18px;
            margin: 10px;
            padding: 5px;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            width: 90vw;
            height: 80px;
            margin: 10px 15px;
            padding: 5px;
        }


        .card{
            background-color: white;
            flex: 1;
            border-radius: 10px;
        }

        h2 {
            font-size: 18px;
            margin: 16px 10px 0px;
        }

        p{
            font-size: 12px;
            padding: 0;
            margin: 4px 10px 0px;
        }

    </style>

</head>
<body>
    <nav>
        <h1>Arena pixel</h1>
        <ul>
            <li><a href="#"> Inicio</a></li>
            <li><a href="#"> Ranking</a></li>
            <li><a href="#"> Inscrição</a></li>
        </ul>
    </nav>

    <main>
        <div class="card">
                <h2>1º Ana</h2>
                <p>1200 pontos</p>
        </div>
        <div class="card">
                <h2>2º Lucas</h2>
                <p>950 pontos</p>
        </div>
        <div class="card">
                <h2>3º Bia</h2>
                <p>800 pontos</p>
        </div>
    </main>
</body>
</html>
